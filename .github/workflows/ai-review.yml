name: AI review (manual)

# The organization ruleset runs AI review on pull requests. This workflow is
# the admin-only manual path for fork PRs or a requested re-review.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
      model:
        description: Model ID override (blank = choose by filtered diff size)
        required: false
      effort:
        description: Reasoning effort override (blank = AI_REVIEW_EFFORT)
        required: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: manual-ai-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    uses: dragonleech-code/ai-review/.github/workflows/ai-review.yml@v1
    with:
      pr_number: ${{ inputs.pr_number }}
      model: ${{ inputs.model }}
      effort: ${{ inputs.effort }}
    secrets: inherit
