name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # Releases are signed (see .goreleaser.yaml's `signs:` block). The
      # public half is committed at internal/selfupdate/signing.pub and
      # compiled into the binary; MINISIGN_SECRET_KEY holds the other half.
      #
      # Both halves have to be present and agree, and the release fails loudly
      # if either is missing — the failure mode this replaces was a release
      # that shipped with verification code and nothing to verify.
      - name: Set up release signing
        # Secrets reach the script through env, never ${{ }} interpolation into
        # its text: an interpolated value becomes part of the shell source, so
        # a quote or $(...) in it would be executed.
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "MINISIGN_SECRET_KEY is not set: releases must be signed." >&2
            echo "Generate a key with 'minisign -G', add the secret key here," >&2
            echo "and commit the public key to internal/selfupdate/signing.pub." >&2
            exit 1
          fi
          sudo apt-get update && sudo apt-get install -y minisign
          umask 077
          printf '%s' "${MINISIGN_SECRET_KEY}" > /tmp/minisign.key
          # The embedded public key must match the signing key, or every
          # `wyrm selfupdate` on this release would reject its own signature.
          printf 'signing key check\n' > /tmp/keycheck.txt
          minisign -Sm /tmp/keycheck.txt -s /tmp/minisign.key <<< "${MINISIGN_PASSWORD}"
          minisign -Vm /tmp/keycheck.txt -p internal/selfupdate/signing.pub
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          MINISIGN_KEY_FILE: /tmp/minisign.key
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}

  aur:
    name: Publish AUR package
    needs: release
    runs-on: ubuntu-latest
    # Only reads the release it publishes; pushing to the AUR uses its own key.
    permissions:
      contents: read
    steps:
      # The `secrets` context is not available in a job-level `if:`, so the
      # gate has to be a step. Without a deploy key configured the rest of the
      # job no-ops and stays green: the GitHub release and the Homebrew tap
      # have already shipped by this point, and a missing or rotated AUR key
      # should not paint the whole tag red.
      - name: Check for an AUR deploy key
        id: gate
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set — skipping the AUR publish for ${GITHUB_REF_NAME}."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.configured == 'true'

      # packaging/aur/PKGBUILD in the repo is a template (pkgver=0.0.0,
      # zeroed checksums) — the real values come from this release's own
      # checksums.txt so the AUR package's hashes are never hand-typed.
      - name: Fill in PKGBUILD for this release
        if: steps.gate.outputs.configured == 'true'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          checksums="$(curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/checksums.txt")"
          amd64_sum="$(printf '%s\n' "$checksums" | grep '_linux_amd64\.tar\.gz$' | awk '{print $1}')"
          arm64_sum="$(printf '%s\n' "$checksums" | grep '_linux_arm64\.tar\.gz$' | awk '{print $1}')"
          if [ -z "$amd64_sum" ] || [ -z "$arm64_sum" ]; then
            echo "missing checksum for one or both linux archives in checksums.txt" >&2
            exit 1
          fi
          sed \
            -e "s/^pkgver=.*/pkgver=${version}/" \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${amd64_sum}')/" \
            -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${arm64_sum}')/" \
            packaging/aur/PKGBUILD > /tmp/PKGBUILD

      - name: Publish to the AUR
        if: steps.gate.outputs.configured == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: wyrm-bin
          pkgbuild: /tmp/PKGBUILD
          commit_username: Jason Skollingsberg
          commit_email: jskoll@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "wyrm-bin ${{ github.ref_name }}"
